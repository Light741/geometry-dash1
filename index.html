<script>
// Optimisation FPS
let lastFrame = 0;
function optimizedLoop(timestamp) {
    if (!gameRunning) return;

    if (timestamp - lastFrame > 16) { // ~60 FPS
        gameLoop();
        lastFrame = timestamp;
    }

    requestAnimationFrame(optimizedLoop);
}

// Lancement optimisé
function startGame() {
    document.getElementById("menu").style.display = "none";
    gameRunning = true;
    requestAnimationFrame(optimizedLoop);
}

// Retry optimisé
function retryGame() {
    player = { x: 100, y: 300, size: 30, vy: 0, onGround: false };
    obstacles = [];
    platforms = [];
    particles = [];
    document.getElementById("gameOver").style.display = "none";
    gameRunning = true;
    requestAnimationFrame(optimizedLoop);
}
</script>
