<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Geometry Dash Infinite – SHIP Mode</title>
<style>
body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;height:100vh;color:#fff;font-family:sans-serif;}
canvas{background:#222;border:2px solid #555;}
</style>
</head>
<body>
<canvas id="game" width="900" height="400"></canvas>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const GRAVITY=0.6,SHIP_GRAVITY=0.25,SHIP_THRUST=-0.55,JUMP_FORCE=-12,PLAYER_SIZE=40,GROUND_Y=320;

let player={x:100,y:GROUND_Y-PLAYER_SIZE,vy:0,onGround:true};
let mode="cube",cameraX=0,speed=6,score=0,gameOver=false,t=0;

let obstacles=[],platforms=[],jumpPads=[],jumpRings=[],shipPortals=[],cubePortals=[],particles=[];

const biomes=["lave","montagne","foret","glace","eau","desert"];
let currentBiome="foret",biomeTimer=0,nextBiomeChange=200+Math.random()*600;

const biomeStyles={
lave:{platform:"#662200",pad:"#ff6600",ring:"#ff3300",ground:"#552200",sky:"#200000",far:"#401010",mid:"#803020"},
montagne:{platform:"#555",pad:"#aaa",ring:"#ccc",ground:"#444",sky:"#101020",far:"#303040",mid:"#505060"},
foret:{platform:"#116622",pad:"#44aa44",ring:"#55cc55",ground:"#225522",sky:"#001510",far:"#003322",mid:"#115533"},
glace:{platform:"#99ddff",pad:"#cceeff",ring:"#88ddff",ground:"#77bbdd",sky:"#001020",far:"#103050",mid:"#205070"},
eau:{platform:"#004488",pad:"#0099ff",ring:"#33bbff",ground:"#003366",sky:"#000814",far:"#001a33",mid:"#003a66"},
desert:{platform:"#b8863b",pad:"#e6c27a",ring:"#f2d59c",ground:"#c49b47",sky:"#201000",far:"#403010",mid:"#805020"}
};

const farMountains=[],midObjects=[];
function initParallax(){
farMountains.length=0;midObjects.length=0;
for(let i=0;i<8;i++)farMountains.push({x:i*300,h:80+Math.random()*80});
for(let i=0;i<10;i++)midObjects.push({x:i*220,h:40+Math.random()*60});
}

function drawParallax(){
const s=biomeStyles[currentBiome];
ctx.fillStyle=s.sky;ctx.fillRect(0,0,canvas.width,canvas.height);
const wobF=Math.sin(t*0.2)*2,wobM=Math.sin(t*0.3)*3;
ctx.fillStyle=s.far;
farMountains.forEach(m=>{
let x=m.x-cameraX*0.2,y=GROUND_Y+40+wobF;
ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+200,y);ctx.lineTo(x+100,y-m.h);ctx.fill();
});
ctx.fillStyle=s.mid;
midObjects.forEach(o=>{
let x=o.x-cameraX*0.4,y=GROUND_Y+20+wobM;
ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+120,y);ctx.lineTo(x+60,y-o.h);ctx.fill();
});
}

function resetGame(){
player={x:100,y:GROUND_Y-PLAYER_SIZE,vy:0,onGround:true};
cameraX=0;score=0;gameOver=false;mode="cube";
obstacles=[];platforms=[];jumpPads=[];jumpRings=[];shipPortals=[];cubePortals=[];particles=[];
initParallax();
}

function lastX(a){return a.length===0?0:a[a.length-1].x;}

function generateWorld(){
let ahead=player.x+900;
if(ahead-lastX(obstacles)>350&&Math.random()<0.05)
obstacles.push({x:ahead+Math.random()*200,y:GROUND_Y-(40+Math.random()*40),w:40,h:40+Math.random()*40});
if(ahead-lastX(platforms)>450&&Math.random()<0.03)
platforms.push({x:ahead+Math.random()*200,y:150+Math.random()*150,w:120+Math.random()*150,h:20});
if(ahead-lastX(jumpPads)>600&&Math.random()<0.015)
jumpPads.push({x:ahead+Math.random()*200,y:GROUND_Y-20,w:40,h:20,force:-18});
if(ahead-lastX(jumpRings)>700&&Math.random()<0.01)
jumpRings.push({x:ahead+Math.random()*200,y:150+Math.random()*150,r:20,force:-20,used:false});
if(ahead-lastX(shipPortals)>1200&&Math.random()<0.01)
shipPortals.push({x:ahead+Math.random()*200,y:200,r:30});
if(ahead-lastX(cubePortals)>1200&&Math.random()<0.01)
cubePortals.push({x:ahead+Math.random()*200,y:200,r:30});
let limit=player.x-600;
obstacles=obstacles.filter(o=>o.x>limit);
platforms=platforms.filter(o=>o.x>limit);
jumpPads=jumpPads.filter(o=>o.x>limit);
jumpRings=jumpRings.filter(o=>o.x>limit);
shipPortals=shipPortals.filter(o=>o.x>limit);
cubePortals=cubePortals.filter(o=>o.x>limit);
}

function updateBiome(){
biomeTimer++;
if(biomeTimer>nextBiomeChange){
currentBiome=biomes[Math.floor(Math.random()*biomes.length)];
biomeTimer=0;nextBiomeChange=200+Math.random()*600;
}
}

function spawnParticles(){
if(Math.random()>0.4)return;
particles.push({x:cameraX+Math.random()*canvas.width,y:Math.random()*GROUND_Y,size:2+Math.random()*3,baseSize:2+Math.random()*3,life:40+Math.random()*40,vx:0,vy:0,color:"#fff",phase:Math.random()*Math.PI*2});
}

function updateParticles(){
particles.forEach(p=>{
p.x+=p.vx;p.y+=p.vy;p.life--;p.size=p.baseSize*(1+0.2*Math.sin(t*1.2+p.phase));
});
particles=particles.filter(p=>p.life>0);
if(mode==="ship"){
particles.push({x:player.x-cameraX-10,y:player.y+PLAYER_SIZE/2+(Math.random()*6-3),size:3+Math.random()*3,baseSize:3+Math.random()*3,life:20+Math.random()*10,vx:-1-Math.random(),vy:(Math.random()*2-1),color:"rgba(255,255,255,0.6)",phase:Math.random()*Math.PI*2});
}
}

function update(){
if(gameOver)return;
t+=0.02;score++;player.x+=speed;cameraX=player.x-150;
updateBiome();spawnParticles();updateParticles();
if(mode==="cube")player.vy+=GRAVITY;
if(mode==="ship"){player.vy+=SHIP_GRAVITY;if(keys["Space"])player.vy+=SHIP_THRUST;}
player.y+=player.vy;
if(mode==="ship"){
if(player.y<20){player.y=20;player.vy=0;}
if(player.y+PLAYER_SIZE>GROUND_Y-10){player.y=GROUND_Y-PLAYER_SIZE-10;player.vy=0;}
}
if(player.y<0)gameOver=true;
if(mode==="cube"){
if(player.y+PLAYER_SIZE>=GROUND_Y){player.y=GROUND_Y-PLAYER_SIZE;player.vy=0;player.onGround=true;}
else player.onGround=false;
}
platforms.forEach(p=>{
if(player.x+PLAYER_SIZE>p.x&&player.x<p.x+p.w&&player.y+PLAYER_SIZE>p.y&&player.y+PLAYER_SIZE<p.y+20&&player.vy>=0){
player.y=p.y-PLAYER_SIZE;player.vy=0;player.onGround=true;
}
});
jumpPads.forEach(p=>{
if(player.x+PLAYER_SIZE>p.x&&player.x<p.x+p.w&&player.y+PLAYER_SIZE>p.y&&player.y+PLAYER_SIZE<p.y+30)
player.vy=p.force;
});
jumpRings.forEach(r=>{
if(!r.used){
let dx=player.x+PLAYER_SIZE/2-r.x,dy=player.y+PLAYER_SIZE/2-r.y,dist=Math.sqrt(dx*dx+dy*dy);
if(dist<r.r+PLAYER_SIZE/2){player.vy=r.force;r.used=true;}
}
});
shipPortals.forEach(p=>{
let dx=player.x+PLAYER_SIZE/2-p.x,dy=player.y+PLAYER_SIZE/2-p.y,dist=Math.sqrt(dx*dx+dy*dy);
if(dist<p.r+PLAYER_SIZE/2){mode="ship";player.vy=0;}
});
cubePortals.forEach(p=>{
let dx=player.x+PLAYER_SIZE/2-p.x,dy=player.y+PLAYER_SIZE/2-p.y,dist=Math.sqrt(dx*dx+dy*dy);
if(dist<p.r+PLAYER_SIZE/2){mode="cube";player.vy=0;}
});
obstacles.forEach(o=>{
if(player.x<o.x+o.w&&player.x+PLAYER_SIZE>o.x&&player.y<o.y+o.h&&player.y+PLAYER_SIZE>o.y)
gameOver=true;
});
generateWorld();
}

function drawGround(){
let s=biomeStyles[currentBiome];
ctx.fillStyle=s.ground;ctx.fillRect(-cameraX,GROUND_Y,canvas.width+cameraX,canvas.height-GROUND_Y);
ctx.fillStyle="rgba(255,255,255,0.15)";ctx.fillRect(-cameraX,0,canvas.width+cameraX,6);
}

function drawPlayer(){
if(mode==="cube"){
ctx.fillStyle="#00e5ff";ctx.fillRect(player.x-cameraX,player.y,PLAYER_SIZE,PLAYER_SIZE);
}else{
let cx=player.x-cameraX+PLAYER_SIZE/2,cy=player.y+PLAYER_SIZE/2;
let a=Math.max(-0.3,Math.min(0.3,player.vy*-0.03));
ctx.save();ctx.translate(cx,cy);ctx.rotate(a);
ctx.fillStyle="#00e5ff";ctx.beginPath();
ctx.moveTo(-20,10);ctx.lineTo(20,0);ctx.lineTo(-20,-10);
ctx.fill();ctx.restore();
}
}

function drawObstacle(o){ctx.fillStyle="#ff3300";ctx.fillRect(o.x-cameraX,o.y,o.w,o.h);}
function drawPlatforms(){ctx.fillStyle=biomeStyles[currentBiome].platform;platforms.forEach(p=>ctx.fillRect(p.x-cameraX,p.y,p.w,p.h));}
function drawJumpPads(){ctx.fillStyle=biomeStyles[currentBiome].pad;jumpPads.forEach(p=>ctx.fillRect(p.x-cameraX,p.y,p.w,p.h));}
function drawJumpRings(){jumpRings.forEach(r=>{ctx.strokeStyle=biomeStyles[currentBiome].ring;ctx.lineWidth=4;ctx.beginPath();ctx.arc(r.x-cameraX,r.y,r.r,0,Math.PI*2);ctx.stroke();});}
function drawShipPortals(){shipPortals.forEach(p=>{ctx.strokeStyle="#00aaff";ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x-cameraX,p.y,p.r,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x-cameraX,p.y-10);ctx.lineTo(p.x-cameraX,p.y+10);ctx.lineTo(p.x-cameraX+10,p.y);ctx.fillStyle="#00aaff";ctx.fill();});}
function drawCubePortals(){cubePortals.forEach(p=>{ctx.strokeStyle="#fff";ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x-cameraX,p.y,p.r,0,Math.PI*2);ctx.stroke();});}
function drawParticles(){particles.forEach(p=>{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x-cameraX,p.y,p.size,0,Math.PI*2);ctx.fill();});}
function drawScore(){ctx.fillStyle="#fff";ctx.font="20px Arial";ctx.fillText("Score: "+score,20,30);}
function drawGameOver(){ctx.fillStyle="rgba(0,0,0,0.6)";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#fff";ctx.font="40px Arial";ctx.fillText("GAME OVER",canvas.width/2-120,canvas.height/2-20);ctx.font="20px Arial";ctx.fillText("Espace / Toucher pour recommencer",canvas.width/2-170,canvas.height/2+20);}

const keys={};
window.addEventListener("keydown",e=>{
keys[e.code]=true;
if(e.code==="Space"){
if(gameOver)resetGame();
else if(mode==="cube"&&player.onGround){player.vy=JUMP_FORCE;player.onGround=false;}
}
});
window.addEventListener("keyup",e=>keys[e.code]=false);

function resizeCanvas(){
let r=900/400,w=innerWidth,h=innerHeight;
if(w/h>r)w=h*r;else h=w/r;
canvas.style.width=w+"px";canvas.style.height=h+"px";
}
addEventListener("resize",resizeCanvas);resizeCanvas();

let touchActive=false;
addEventListener("touchstart",e=>{
let x=e.touches[0].clientX;
if(x>innerWidth*0.5){
touchActive=true;
if(gameOver){resetGame();return;}
if(mode==="cube"&&player.onGround){player.vy=JUMP_FORCE;player.onGround=false;}
}
});
addEventListener("touchend",()=>touchActive=false);

function applyTouchShipControl(){if(mode==="ship"&&touchActive)player.vy+=SHIP_THRUST;}

function loop(){
ctx.clearRect(0,0,canvas.width,canvas.height);
update();applyTouchShipControl();
drawParallax();drawGround();drawParticles();drawPlatforms();drawJumpPads();drawJumpRings();drawShipPortals();drawCubePortals();obstacles.forEach(drawObstacle);drawPlayer();drawScore();
if(gameOver)drawGameOver();
requestAnimationFrame(loop);
}

initParallax();loop();
</script>
</body>
</html>
